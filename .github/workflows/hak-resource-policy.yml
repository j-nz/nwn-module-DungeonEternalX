name: Hak resource policy

on:
  push:
  pull_request:

jobs:
  validate-hak-resources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject scripts and debug data in hak sources
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(find hak -type f \( -iname '*.nss' -o -iname '*.ncs' -o -iname '*.ndb' \) -print 2>/dev/null || true)"
          if [ -n "$forbidden" ]; then
            echo "Hak resource policy violation: NWScript source/compiled/debug files must not live under hak/."
            echo "$forbidden"
            exit 1
          fi
          echo "Hak resource policy OK."

      - name: Verify governed PRC presentation assets
        shell: bash
        run: |
          set -euo pipefail

          check_blob() {
            path="$1"
            expected="$2"
            test -f "$path" || { echo "Missing governed PRC asset: $path"; exit 1; }
            actual="$(git hash-object "$path")"
            if [ "$actual" != "$expected" ]; then
              echo "PRC donor mismatch: $path"
              echo "expected $expected"
              echo "actual   $actual"
              exit 1
            fi
          }

          check_blob hak/src/is_detect_fave.tga 5fbe6c9b384a023b40b2b7cd3e019f9701618440
          check_blob hak/src/is_snare.tga baf7fca9d534223e8a61eb790960e08138f984fa
          check_blob hak/src/fot_snare.tga d1cc27d03ff410dd314f317e98f38aeb0e44a17c
          check_blob hak/src/is_spslay_arrow.tga a3efa93de7f7e1e126e6ea9874d3f110b1dba7e3
          check_blob hak/src/is_treeshape.tga 32df4ea30fdb53ce98353c48a0a2891dfd940a37
          check_blob hak/src/is_forestfold.tga c7b839f8ea894413bca4c129a2f43ea16182dc8e

          grep -Eq 'AI_DetectFavoredEnemies[[:space:]]+16777216[[:space:]]+is_detect_fave' hak/src/spells.2da
          grep -Eq 'AI_Snare[[:space:]]+16777218[[:space:]]+is_snare' hak/src/spells.2da
          grep -Eq 'AI_SpellslayerArrow[[:space:]]+16777220[[:space:]]+is_spslay_arrow' hak/src/spells.2da
          grep -Eq 'AI_Treeshape[[:space:]]+16777222[[:space:]]+is_treeshape' hak/src/spells.2da
          grep -Eq 'AI_Forestfold[[:space:]]+16777224[[:space:]]+is_forestfold' hak/src/spells.2da

          echo "PRC presentation resource bindings OK."
